---
- name: Update production compose on VM
  hosts: app
  become: true
  gather_facts: false

  vars:
    app_dir: /opt/roomie-match
    ansible_root_dir: "{{ playbook_dir | dirname }}"
    project_root_dir: "{{ playbook_dir | dirname | dirname }}"
    docker_user: "{{ lookup('env', 'DOCKER_USER') }}"
    docker_image_name: "{{ lookup('env', 'DOCKER_IMAGE_NAME') }}"
    docker_image_tag: "{{ lookup('env', 'DOCKER_IMAGE_TAG') | default('latest', true) }}"
    deploy_env: "{{ lookup('env', 'ENV') }}"

  tasks:
    - name: Check required deployment variables
      ansible.builtin.assert:
        that:
          - docker_user | length > 0
          - docker_image_name | length > 0
          - docker_image_tag | length > 0
          - deploy_env | length > 0
        fail_msg: >-
          Required environment variables are missing.
          Set DOCKER_USER, DOCKER_IMAGE_NAME, DOCKER_IMAGE_TAG and ENV.

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy nginx config
      ansible.builtin.copy:
        src: "{{ project_root_dir }}/nginx/nginx.conf"
        dest: "{{ app_dir }}/nginx.conf"
        mode: "0644"

    - name: Write environment file
      ansible.builtin.copy:
        content: "{{ deploy_env }}"
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Render production compose file
      ansible.builtin.template:
        src: "{{ ansible_root_dir }}/templates/docker-compose.prod.yml.j2"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Pull updated images
      community.docker.docker_compose_v2_pull:
        project_src: "{{ app_dir }}"

    - name: Start updated compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        remove_orphans: true

    - name: Prune unused Docker images
      community.docker.docker_prune:
        images: true
        images_filters:
          dangling: false
