openapi: 3.1.0
info:
  title: RoomieMatch API
  description: API сервиса для поиска соседей, онбординга, мэтчей и работы с профилем
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Profiles
    description: Профили пользователей
  - name: Media
    description: Загрузка и удаление файлов
  - name: References
    description: Справочники
  - name: Tags
    description: Теги привычек и интересов
  - name: Blocks
    description: Блокировки пользователей
  - name: Auth
    description: Восстановление пароля и верификация email
  - name: Matches
    description: Взаимные мэтчи

paths:
  /:
    get:
      tags:
        - References
      summary: Проверка доступности API
      responses:
        '200':
          description: API доступен
          content:
            application/json:
              schema:
                type: object
                properties:
                  Hello:
                    type: string
                    example: World

  /profiles:
    post:
      tags:
        - Profiles
      summary: Создать профиль пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreate'
      responses:
        '201':
          description: Профиль успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '409':
          description: Профиль для пользователя уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /profiles/{profile_id}:
    get:
      tags:
        - Profiles
      summary: Получить профиль по ID
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Профиль найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '404':
          description: Профиль не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

    patch:
      tags:
        - Profiles
      summary: Обновить профиль пользователя
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '404':
          description: Профиль не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /profiles/{profile_id}/onboarding:
    patch:
      tags:
        - Profiles
      summary: Сохранить данные онбординга пользователя
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Данные онбординга сохранены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '404':
          description: Профиль не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /media/upload:
    post:
      tags:
        - Media
      summary: Загрузить файл на сервер
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum: [avatar, profile_photo]
      responses:
        '201':
          description: Файл загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '400':
          description: Ошибка загрузки файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /media/{media_id}:
    delete:
      tags:
        - Media
      summary: Удалить загруженный файл
      parameters:
        - name: media_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Файл удалён
        '404':
          description: Файл не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /cities:
    get:
      tags:
        - References
      summary: Получить список городов
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Список городов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityListResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /references/housing-types:
    get:
      tags:
        - References
      summary: Получить справочник типов жилья
      responses:
        '200':
          description: Справочник типов жилья
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /tags:
    get:
      tags:
        - Tags
      summary: Получить теги с фильтрацией по категории
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum:
              - sleep_schedule
              - cleanliness
              - noise_level
              - guest_frequency
              - smoking_preference
              - alcohol_preference
              - room_order_preference
              - pet_preference
              - interests
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Список тегов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
        '400':
          description: Некорректная категория
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /users/{blocked_user_id}/block:
    post:
      tags:
        - Blocks
      summary: Заблокировать пользователя
      parameters:
        - name: blocked_user_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
      responses:
        '200':
          description: Пользователь заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Ошибка блокировки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

    delete:
      tags:
        - Blocks
      summary: Снять блокировку пользователя
      parameters:
        - name: blocked_user_id
          in: path
          required: true
          schema:
            type: integer
        - name: blocker_user_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Блокировка снята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Блокировка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /users/{user_id}/blocked-users:
    get:
      tags:
        - Blocks
      summary: Получить список заблокированных пользователей
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список заблокированных пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedUsersResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /users/{user_id}/block-status:
    get:
      tags:
        - Blocks
      summary: Проверить статус блокировки пользователя
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: blocked_user_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Статус блокировки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockStatusResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Запустить восстановление пароля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Инструкция отправлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '429':
          description: Слишком частые запросы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Сбросить пароль по токену
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Пароль изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '410':
          description: Токен истёк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /auth/resend-verification:
    post:
      tags:
        - Auth
      summary: Повторно отправить код подтверждения email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Код отправлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '429':
          description: Слишком частые запросы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /auth/verify-email:
    post:
      tags:
        - Auth
      summary: Подтвердить email по коду
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email подтверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Неверный код
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '410':
          description: Код истёк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

  /matches:
    get:
      tags:
        - Matches
      summary: Получить список взаимных мэтчей
      parameters:
        - name: profile_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список мэтчей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'

components:
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Операция выполнена успешно
      required:
        - message

    ErrorDetailResponse:
      type: object
      properties:
        detail:
          oneOf:
            - type: string
            - type: object
              properties:
                error:
                  type: string
                message:
                  type: string
      required:
        - detail

    ProfileSex:
      type: string
      enum:
        - male
        - female

    ProfileBase:
      type: object
      required:
        - user_id
        - uni_id
        - name
        - sex
        - age
      properties:
        user_id:
          type: integer
          example: 10
        uni_id:
          type: integer
          example: 2
        neighbourhood_id:
          type: integer
          nullable: true
          example: 3
        name:
          type: string
          example: Vera
        sex:
          $ref: '#/components/schemas/ProfileSex'
        age:
          type: integer
          example: 20
        profile_picture_url:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        photo_urls:
          type: array
          items:
            type: string
        sleep_schedule:
          type: string
          nullable: true
        cleanliness:
          type: string
          nullable: true
        noise_level:
          type: string
          nullable: true
        guest_frequency:
          type: string
          nullable: true
        smoking_preference:
          type: string
          nullable: true
        alcohol_preference:
          type: string
          nullable: true
        room_order_preference:
          type: string
          nullable: true
        pet_preference:
          type: string
          nullable: true
        has_quiet_hours:
          type: boolean
        quiet_from:
          type: string
          nullable: true
        quiet_to:
          type: string
          nullable: true
        is_smoking_allowed:
          type: boolean
        has_pets:
          type: boolean
        budget_min:
          type: integer
          nullable: true
        budget_max:
          type: integer
          nullable: true
        move_in_date:
          type: string
          format: date
          nullable: true
        stay_duration:
          type: string
          nullable: true
        housing_type:
          type: string
          nullable: true
        living_notes:
          type: string
          nullable: true
        ideal_roommate_description:
          type: string
          nullable: true
        rental_criteria:
          type: string
          nullable: true
        interests:
          type: array
          items:
            type: string
        compatibility_note:
          type: string
          nullable: true

    ProfileCreate:
      allOf:
        - $ref: '#/components/schemas/ProfileBase'

    ProfileUpdate:
      type: object
      properties:
        uni_id:
          type: integer
          nullable: true
        neighbourhood_id:
          type: integer
          nullable: true
        name:
          type: string
          nullable: true
        sex:
          $ref: '#/components/schemas/ProfileSex'
        age:
          type: integer
          nullable: true
        profile_picture_url:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        photo_urls:
          type: array
          items:
            type: string
        sleep_schedule:
          type: string
          nullable: true
        cleanliness:
          type: string
          nullable: true
        noise_level:
          type: string
          nullable: true
        guest_frequency:
          type: string
          nullable: true
        smoking_preference:
          type: string
          nullable: true
        alcohol_preference:
          type: string
          nullable: true
        room_order_preference:
          type: string
          nullable: true
        pet_preference:
          type: string
          nullable: true
        has_quiet_hours:
          type: boolean
          nullable: true
        quiet_from:
          type: string
          nullable: true
        quiet_to:
          type: string
          nullable: true
        is_smoking_allowed:
          type: boolean
          nullable: true
        has_pets:
          type: boolean
          nullable: true
        budget_min:
          type: integer
          nullable: true
        budget_max:
          type: integer
          nullable: true
        move_in_date:
          type: string
          format: date
          nullable: true
        stay_duration:
          type: string
          nullable: true
        housing_type:
          type: string
          nullable: true
        living_notes:
          type: string
          nullable: true
        ideal_roommate_description:
          type: string
          nullable: true
        rental_criteria:
          type: string
          nullable: true
        interests:
          type: array
          items:
            type: string
          nullable: true
        compatibility_note:
          type: string
          nullable: true

    ProfileResponse:
      allOf:
        - $ref: '#/components/schemas/ProfileBase'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    MediaUploadResponse:
      type: object
      required:
        - id
        - url
        - filename
      properties:
        id:
          type: integer
        url:
          type: string
          example: /uploads/abc123.jpg
        kind:
          type: string
          enum: [avatar, profile_photo]
          nullable: true
        filename:
          type: string
          example: abc123.jpg

    CityItem:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string

    CityListResponse:
      type: object
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CityItem'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    ReferenceOption:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
        label:
          type: string

    ReferenceListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceOption'

    TagResponse:
      type: object
      required:
        - id
        - category
        - value
        - label
      properties:
        id:
          type: integer
        category:
          type: string
          enum:
            - sleep_schedule
            - cleanliness
            - noise_level
            - guest_frequency
            - smoking_preference
            - alcohol_preference
            - room_order_preference
            - pet_preference
            - interests
        value:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TagListResponse:
      type: object
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TagResponse'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    BlockUserRequest:
      type: object
      required:
        - blocker_user_id
      properties:
        blocker_user_id:
          type: integer

    BlockStatusResponse:
      type: object
      required:
        - blocked
      properties:
        blocked:
          type: boolean

    BlockedUserItem:
      type: object
      required:
        - id
        - blocker_user_id
        - blocked_user_id
        - created_at
      properties:
        id:
          type: integer
        blocker_user_id:
          type: integer
        blocked_user_id:
          type: integer
        created_at:
          type: string
          format: date-time

    BlockedUsersResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlockedUserItem'

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    VerifyEmailRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          example: '123456'

    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string

    MatchItem:
      type: object
      required:
        - id
        - profile_id
        - name
        - age
        - deal_id
      properties:
        id:
          type: integer
        profile_id:
          type: integer
        name:
          type: string
        age:
          type: integer
