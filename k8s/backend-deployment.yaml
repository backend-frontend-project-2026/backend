apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: roomie-match

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: postgres:18
          command: [sh, -c, 'until pg_isready -h postgres -p 5432; do sleep 2; done']
      containers:
        - name: backend
          image: roomie-match-backend:local
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          startupProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            periodSeconds: 10

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

          volumeMounts:
            - name: backend-media
              mountPath: /app/media
            - name: backend-logs
              mountPath: /app/logs

          command:
            - /bin/sh
            - -c

          args:
            - |
              alembic upgrade head &&
              python scripts/bootstrap_rbac.py &&
              exec gunicorn -c gunicorn.conf.py app.main:app

      volumes:
        - name: backend-media
          persistentVolumeClaim:
            claimName: backend-media
        - name: backend-logs
          emptyDir: {}
