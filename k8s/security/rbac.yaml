apiVersion: v1
kind: ServiceAccount
metadata: {name: pod-watcher, namespace: roomie-match}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pod-reader, namespace: roomie-match}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: pod-readers, namespace: roomie-match}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-reader}
subjects:
- {kind: ServiceAccount, name: pod-watcher, namespace: roomie-match}
- {kind: User, apiGroup: rbac.authorization.k8s.io, name: roomie-viewer}
