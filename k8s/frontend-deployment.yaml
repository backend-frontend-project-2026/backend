apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roomie-match

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: roomie-match-frontend:local
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5

          volumeMounts:
            - name: backend-media
              mountPath: /media
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: backend-media
          persistentVolumeClaim:
            claimName: backend-media
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
