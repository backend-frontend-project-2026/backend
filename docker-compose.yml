x-back-image: &back-image ceoceo/roomie-match-backend:latest
x-front-image: &front-image ceoceo/roomie-match-frontend:latest

x-backend-common: &backend-common
  image: *back-image
  env_file: .env
  environment:
    DB_HOST: db

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *backend-common
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  bootstrap:
    <<: *backend-common
    command: ["python", "scripts/bootstrap_rbac.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  api:
    <<: *backend-common
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/openapi.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: *front-image
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/media:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
