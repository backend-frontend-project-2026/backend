name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Create release tag
    runs-on: ubuntu-latest

    outputs:
      released: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  deploy:
    name: Build image and update compose
    runs-on: ubuntu-latest
    needs: release

    if: needs.release.outputs.released == 'true'

    env:
      DOCKER_USER: ${{ vars.DOCKER_USER }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      DOCKER_IMAGE_TAG: v${{ needs.release.outputs.version }}
      ENV: ${{ secrets.ENV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key-b64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          vm-host: ${{ vars.VM_HOST }}
          vm-user: ${{ vars.VM_USER }}

      - name: Lint Ansible playbooks
        shell: bash
        run: |
          ansible-lint ansible/playbooks/init-vm.yml
          ansible-lint ansible/playbooks/build-and-push-image.yml
          ansible-lint ansible/playbooks/update-compose.yml

      - name: Build and push backend image
        shell: bash
        run: |
          ansible-playbook \
            -i ansible/inventories.ini \
            ansible/playbooks/build-and-push-image.yml

      - name: Update compose on VM
        shell: bash
        run: |
          ansible-playbook \
            -i ansible/inventories.ini \
            ansible/playbooks/update-compose.yml