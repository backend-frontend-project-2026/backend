name: Ansible Lint

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - feature/task-10

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Lint Ansible playbooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible ansible-lint

      - name: Install Ansible collections
        shell: bash
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run ansible-lint
        shell: bash
        run: |
          ansible-lint ansible/playbooks/init-vm.yml
          ansible-lint ansible/playbooks/build-and-push-image.yml
          ansible-lint ansible/playbooks/update-compose.yml