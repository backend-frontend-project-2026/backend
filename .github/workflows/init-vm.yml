name: Init VM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init-vm:
    name: Initialize VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key-b64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Create Ansible inventory
        shell: bash
        run: |
          cat > ansible/inventories.ini <<EOF
          [app]
          ${{ vars.VM_HOST }} ansible_user=${{ vars.VM_USER }} ansible_ssh_private_key_file=~/.ssh/deploy_key
          EOF

      - name: Run VM initialization playbook
        shell: bash
        run: |
          ansible-playbook \
            -i ansible/inventories.ini \
            ansible/playbooks/init-vm.yml

      - name: Run ansible-lint
        shell: bash
        run: |
          ansible-lint ansible/playbooks/init-vm.yml